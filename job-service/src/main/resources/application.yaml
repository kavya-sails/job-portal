spring:
  application:
    name: job-service

  cloud:
    config:
      enabled: false
      import-check:
        enabled: false

  datasource:
    url: jdbc:postgresql://localhost:5432/jobdb
    username: postgres
    password: admin      # quote the password
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

eureka:                        # moved out from under flyway
  client:
    register-with-eureka: false
    fetch-registry: false

server:
  port: 8001

logging:
  level:
    root: INFO
    org.hibernate.SQL: DEBUG